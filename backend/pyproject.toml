[project]
name = "tara-backend"
version = "0.1.0"
description = "Domain-switchable voice + chat RAG assistant (LiveKit, Supabase, Groq)"
requires-python = ">=3.10"
dependencies = [
  "livekit-agents>=1.0",
  "livekit-plugins-silero>=1.0",
  "livekit-api>=1.0",
  "supabase>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "numpy>=1.26",
  "pypdf>=4.0",
  "httpx>=0.27",
  "livekit-plugins-groq>=1.8.4",
  "fastembed>=0.8.1",
  "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
